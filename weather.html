<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Smart Agriculture Portal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4fff4;
  transition: 0.4s;
}

nav {
  background: darkgreen;
  padding: 15px;
  text-align: center;
}

nav a {
  color: white;
  margin: 0 12px;
  text-decoration: none;
  font-weight: bold;
}

h1 {
  text-align: center;
  color: darkgreen;
  margin: 25px;
}

.card {
  background: white;
  width: 85%;
  max-width: 1000px;
  margin: 25px auto;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: green;
  color: white;
  margin: 5px 0;
}

input, select {
  padding: 8px;
  border-radius: 6px;
  margin: 5px 0;
  width: 200px;
}

.night {
  background: #0f172a;
  color: white;
}

.night .card {
  background: #1e293b;
  color: white;
}

.weather-report {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-top: 14px;
}

.weather-stat {
  background: #eef8ee;
  border: 1px solid #d0e6d0;
  border-radius: 10px;
  padding: 12px;
}

.weather-stat strong {
  display: block;
  color: darkgreen;
  margin-bottom: 4px;
  font-size: 0.85rem;
}

.night .weather-stat {
  background: #162334;
  border-color: #2c425e;
}

footer {
  background: darkgreen;
  color: white;
  text-align: center;
  padding: 15px;
  margin-top: 30px;
}
</style>
</head>

<body id="page">

<nav>
<a href="home.html">Home</a>
<a href="weather.html">Weather Portal</a>
<a href="map-tools.html">Map Tools</a>
<a href="crop-tools.html">Crop Tools</a>
<a href="yield-prediction.html">Yield</a>
<a href="history-export.html">History</a>
<a href="gallery.html">Gallery</a>
<a href="lifestyle.html">Lifestyle</a>
<a href="seasons.html">Seasons</a>
<a href="contact.html">Contact</a>
</nav>

<h1>Ultimate Smart Agriculture Portal</h1>

<div style="text-align:center;">
<button onclick="toggleMode()">Toggle Day/Night</button>
</div>

<div class="card">
<h2>Auto Weather</h2>
<button onclick="detectWeather()">Detect My Weather</button>
<p id="weatherResult"></p>
<div class="weather-report" id="weatherReport" hidden>
<div class="weather-stat">
<strong>Temperature</strong>
<span id="weatherTemp">--</span>
</div>
<div class="weather-stat">
<strong>Feels Like</strong>
<span id="weatherFeelsLike">--</span>
</div>
<div class="weather-stat">
<strong>Humidity</strong>
<span id="weatherHumidity">--</span>
</div>
<div class="weather-stat">
<strong>Wind</strong>
<span id="weatherWind">--</span>
</div>
</div>
</div>

<div class="card">
<h2>Monthly Rainfall Chart</h2>
<canvas id="rainChart"></canvas>
</div>

<footer>
&copy; 2026 Ultimate Smart Agriculture Portal | Built by Venu
</footer>

<script>
const weatherApiKey = "YOUR_OPENWEATHER_API_KEY";
let db;

function initDB() {
  const request = indexedDB.open("agriAI", 1);
  request.onupgradeneeded = (event) => {
    const database = event.target.result;
    const store = database.createObjectStore("records", { keyPath: "id", autoIncrement: true });
    store.createIndex("type", "type", { unique: false });
    store.createIndex("createdAt", "createdAt", { unique: false });
  };
  request.onsuccess = (event) => {
    db = event.target.result;
  };
}

function saveRecord(type, input, result) {
  if (!db) return;
  const tx = db.transaction(["records"], "readwrite");
  tx.objectStore("records").add({ type, input, result, createdAt: new Date().toISOString() });
}

function toggleMode() {
  document.getElementById("page").classList.toggle("night");
}

function detectWeather() {
  const target = document.getElementById("weatherResult");

  if (!navigator.geolocation) {
    target.innerText = "Geolocation not supported by this browser.";
    clearWeatherReport();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      fetch("https://api.openweathermap.org/data/2.5/weather?lat=" + lat + "&lon=" + lon + "&appid=" + weatherApiKey + "&units=metric")
        .then((res) => res.json())
        .then((data) => {
          if (!data.main || !data.weather || !data.weather[0]) {
            target.innerText = "Weather unavailable. Add a valid OpenWeather API key.";
            clearWeatherReport();
            return;
          }

          target.innerHTML =
            "Location: " + data.name +
            "<br>Temperature: " + data.main.temp.toFixed(1) + " C" +
            "<br>Condition: " + data.weather[0].description;
          renderWeatherReport(data);
          saveRecord("weather", { lat, lon }, {
            location: data.name,
            temp: data.main.temp,
            feelsLike: data.main.feels_like,
            humidity: data.main.humidity,
            wind: data.wind?.speed ?? 0,
            desc: data.weather[0].description
          });
        })
        .catch(() => {
          target.innerText = "Failed to fetch weather details.";
          clearWeatherReport();
        });
    },
    () => {
      target.innerText = "Location permission denied.";
      clearWeatherReport();
    }
  );
}

function renderWeatherReport(data) {
  document.getElementById("weatherReport").hidden = false;
  document.getElementById("weatherTemp").innerText = data.main.temp.toFixed(1) + " C";
  document.getElementById("weatherFeelsLike").innerText = data.main.feels_like.toFixed(1) + " C";
  document.getElementById("weatherHumidity").innerText = data.main.humidity + "%";
  document.getElementById("weatherWind").innerText = (data.wind?.speed ?? 0).toFixed(1) + " m/s";
}

function clearWeatherReport() {
  document.getElementById("weatherReport").hidden = true;
  document.getElementById("weatherTemp").innerText = "--";
  document.getElementById("weatherFeelsLike").innerText = "--";
  document.getElementById("weatherHumidity").innerText = "--";
  document.getElementById("weatherWind").innerText = "--";
}

const ctx = document.getElementById("rainChart");
new Chart(ctx, {
  type: "bar",
  data: {
    labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
    datasets: [{
      label: "Rainfall (mm)",
      data: [20, 25, 40, 60, 80, 150, 300, 280, 200, 120, 60, 30],
      backgroundColor: "green"
    }]
  }
});

initDB();
</script>

</body>
</html>
